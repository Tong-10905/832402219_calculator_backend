# Application name
spring.application.name=calculator-backend
# Service port: after start-up, visit http://localhost:8080
server.port=8080

# SQLite database: a calculator.db file is created and used in the project root directory,
# so the history is persisted to disk and will not be lost after restart.
spring.datasource.url=jdbc:sqlite:calculator.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate does not include SQLite support, so the community dialect is used here
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# When the table does not exist, it is created automatically based on the entity class
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
